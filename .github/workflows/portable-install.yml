name: portable installation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - name: Test installed reporting without engine or plotting extras
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/spectypus-wheel"
          "$RUNNER_TEMP/spectypus-wheel/bin/python" -m pip install dist/*.whl pytest
          mkdir "$RUNNER_TEMP/spectypus-tests"
          cp tests/conftest.py tests/test_match_report.py tests/test_template_locations.py tests/test_diagnostics.py tests/test_evaluation.py "$RUNNER_TEMP/spectypus-tests/"
          cd "$RUNNER_TEMP/spectypus-tests"
          "$RUNNER_TEMP/spectypus-wheel/bin/python" -c "import spectypus; assert 'site-packages' in spectypus.__file__"
          "$RUNNER_TEMP/spectypus-wheel/bin/python" -m pytest -q
