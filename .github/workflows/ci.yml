name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      test_exit: ${{ steps.tests.outputs.exit_code }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      JAX_CPU_ENABLE_ASYNC_DISPATCH: 'false'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false --xla_cpu_enable_fast_math=false --xla_cpu_parallel_codegen_split_count=1 --xla_force_host_platform_device_count=1 intra_op_parallelism_threads=1 inter_op_parallelism_threads=1'
      COVERAGE_FILE: results/ci/.coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test and engine dependencies
        run: python -m pip install -e '.[dev,webtest,engines,jax,ci]'
      - name: Test with reports
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p results/ci
          rm -f results/ci/junit.xml results/ci/coverage.xml
          set +e
          python -m pytest -q --junitxml=results/ci/junit.xml --cov=spectypus --cov-report=xml:results/ci/coverage.xml --cov-report=term
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Build distributions and smoke-test installed wheel
        shell: bash
        run: |
          python -m build --outdir results/ci/dist
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps results/ci/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import spectypus; from spectypus.adapters import ngsf_backend; assert 'site-packages' in spectypus.__file__; print(spectypus.__file__)"
          "$RUNNER_TEMP/wheel-check/bin/python" -m spectypus --help
      - name: Upload private CI reports and distributions
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports
          path: results/ci/
          retention-days: 14
      - name: Preserve test failure
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: test "$TEST_OUTCOME" = success

  badges:
    needs: checks
    continue-on-error: true
    # Never grant write credentials to pull-request jobs or fork code.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: ci-reports
          path: results/ci
      - name: Generate report-derived private badges
        id: metrics
        continue-on-error: true
        env:
          TEST_EXIT: ${{ needs.checks.outputs.test_exit || '1' }}
          BUILD_STATUS: ${{ needs.checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/ci_metrics.py --junit results/ci/junit.xml --coverage results/ci/coverage.xml --exit-code "$TEST_EXIT" --build-status "$BUILD_STATUS" --source-sha "$GITHUB_SHA" --run-url "$RUN_URL" --output-dir results/ci/badges
          cat results/ci/badges/*.json >> "$GITHUB_STEP_SUMMARY"
      - name: Update only badge assets on the tested branch
        if: steps.metrics.outcome == 'success'
        continue-on-error: true
        env:
          BADGE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          current=$(git ls-remote origin "refs/heads/$BADGE_BRANCH" | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced; leave badge publication to its newer run.'
            exit 0
          fi
          cp results/ci/badges/ci-*.svg assets/
          git add assets/ci-build.svg assets/ci-tests.svg assets/ci-coverage.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update badges from verified CI reports'
          git push origin "HEAD:refs/heads/$BADGE_BRANCH"
