[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectypus"
version = "0.1.0"
description = "Batch supernova spectral classification across engines and epochs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Avinash Singh"}]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4", "scipy>=1.15,<2", "SciencePlots>=2,<3", "pypalettes>=0.1,<1"]
dev = ["pytest>=7", "build>=1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
webtest = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
engines = [
    "snid-sage==1.2.3",
    "numpy==2.2.6",
    "scipy==1.15.2",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "astropy==6.1.7",
    "scikit-learn==1.7.2",
    "extinction==0.4.9",
    "PyAstronomy==0.25.0",
]

[project.scripts]
spectypus = "spectypus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectypus = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
